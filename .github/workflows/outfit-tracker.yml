name: Outfit Tracker

on:
  push:
    paths:
      - "outfit-tracker/**"
      - ".github/workflows/outfit-tracker.yml"
  pull_request:
    paths:
      - "outfit-tracker/**"
      - ".github/workflows/outfit-tracker.yml"

permissions:
  contents: read

jobs:
  assemble-debug:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: outfit-tracker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: outfit-tracker-debug
          path: outfit-tracker/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
