name: Outfit Tracker

on:
  push:
    paths:
      - "outfit-tracker/**"
      - ".github/workflows/outfit-tracker.yml"
  pull_request:
    paths:
      - "outfit-tracker/**"
      - ".github/workflows/outfit-tracker.yml"

permissions:
  contents: write

concurrency:
  group: outfit-tracker-debug-${{ github.ref }}
  cancel-in-progress: false

jobs:
  assemble-debug:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: outfit-tracker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: outfit-tracker-debug-apk
          path: outfit-tracker/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish pre-release
        if: github.event_name == 'push'
        working-directory: outfit-tracker
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk "${RUNNER_TEMP}/outfit-tracker.apk"
          if gh release view outfit-tracker-latest >/dev/null 2>&1; then
            gh release delete outfit-tracker-latest --yes --cleanup-tag
          fi
          gh release create outfit-tracker-latest "${RUNNER_TEMP}/outfit-tracker.apk" \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "Outfit Tracker latest debug" \
            --notes "Debug APK from ${{ github.sha }}. Replace this build on the next push."
