name: Bot Bekalut

on:
  push:
    paths:
      - "bot-bekalut/**"
      - ".github/workflows/bot-bekalut.yml"
  pull_request:
    paths:
      - "bot-bekalut/**"
      - ".github/workflows/bot-bekalut.yml"

permissions:
  contents: write

concurrency:
  group: bot-bekalut-latest-release
  cancel-in-progress: false

jobs:
  assemble-debug:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot-bekalut
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bot-bekalut-debug-apk
          path: bot-bekalut/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish pre-release
        if: github.event_name == 'push'
        working-directory: bot-bekalut
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk "${RUNNER_TEMP}/bot-bekalut.apk"
          NOTES="Debug APK from ${GITHUB_SHA}."
          if gh release view bot-bekalut-latest >/dev/null 2>&1; then
            gh release upload bot-bekalut-latest "${RUNNER_TEMP}/bot-bekalut.apk" --clobber
            gh release edit bot-bekalut-latest \
              --prerelease \
              --title "Bot Bekalut latest debug" \
              --notes "${NOTES}"
          else
            gh api --method DELETE "repos/${GH_REPO}/git/refs/tags/bot-bekalut-latest" >/dev/null 2>&1 || true
            gh release create bot-bekalut-latest "${RUNNER_TEMP}/bot-bekalut.apk" \
              --prerelease \
              --target "${GITHUB_SHA}" \
              --title "Bot Bekalut latest debug" \
              --notes "${NOTES}"
          fi
